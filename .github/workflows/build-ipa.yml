name: Build iOS IPA

# 在 GitHub 的 macOS 机器上编译出未签名的 .ipa，下载后用 iLoader / SideStore 签名安装。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets
        run: pnpm build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Register native plugins
        run: node scripts/patch-cap-config.mjs

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install --repo-update

      - name: Add Live Activity widget target
        working-directory: ios/App
        run: ruby ../scripts/add-widget-target.rb

      - name: Build archive (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Qingyin.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH="$RUNNER_TEMP/Qingyin.xcarchive/Products/Applications/App.app"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry Qingyin-unsigned.ipa Payload
          ls -lh Qingyin-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Qingyin-unsigned-ipa
          path: ${{ runner.temp }}/Qingyin-unsigned.ipa
          if-no-files-found: error
